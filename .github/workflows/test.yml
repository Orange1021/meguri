name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin the image: the core suite runs Electron as Node, and the Electron binary
    # dynamically links GUI libs (libnss3 / gtk / gbm / asound …) that the GitHub
    # ubuntu runner already provides via its preinstalled browsers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep in sync with engines.node in package.json; react-router v8 needs 22.22+.
          node-version: 22.22.x
          cache: npm

      # postinstall (electron-builder install-app-deps) rebuilds better-sqlite3 for Electron,
      # which is exactly the ABI the core tests load via ELECTRON_RUN_AS_NODE.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Runs test:core (Electron-as-Node, better-sqlite3 against in-memory SQLite) then
      # test:renderer (plain Node + jsdom).
      - name: Run unit tests
        run: npm test

      # E2E: launch the built Electron app under xvfb (headless display).
      # Ubuntu 24.04 restricts unprivileged user namespaces; Electron needs this sysctl.
      - name: Install Playwright browser deps
        run: npx playwright install --with-deps

      # Builds, then runs under Xvfb pinned to X11 (same as local runs).
      - name: Run E2E tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:e2e:headless

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64

      - name: Run the unit suite on Windows
        run: npm test

      - name: Type check on Windows
        run: npm run typecheck

      - name: Build the copyable portable directory
        run: npm run dist:portable

      - name: Launch and replace the packaged EXE
        run: npm run test:portable-smoke
